openapi: 3.0.3
info:
  title: SIFAP Cycle Generation API
  version: 0.2.0
  description: |
    Convenções:
    - IDs são UUID (formato `uuid` em todos os endpoints).
    - Competência em ISO 8601 `YYYY-MM` (ex.: `2026-05`). Convertida internamente para `YearMonth`/DATE.
    - Erros seguem RFC 7807 (Problem Details).
paths:
  /api/v1/payment-cycles:
    post:
      summary: Inicia execução de ciclo mensal de pagamento
      description: |
        REQ-PAY-005: cria pagamentos apenas para beneficiários com status
        ACTIVE, ordenados por CPF ascendente. REQ-PAY-003: em dezembro com
        programa tipo A, calcula 13º + abono natalino.
      operationId: createPaymentCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competence]
              properties:
                competence:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                  example: '2026-05'
                  description: Competência em formato ISO 8601 YYYY-MM (REQ-PAY-001).
      responses:
        '201':
          description: Ciclo iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleExecution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Ciclo já existente para a competência
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      summary: Lista ciclos por competência
      operationId: listPaymentCycles
      parameters:
        - $ref: '#/components/parameters/YearMonthQuery'
      responses:
        '200':
          description: Lista de execuções de ciclo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CycleExecution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/payment-cycles/{cycleId}:
    get:
      summary: Consulta status da execução do ciclo
      operationId: getPaymentCycle
      parameters:
        - $ref: '#/components/parameters/CycleIdPath'
      responses:
        '200':
          description: Status da execução
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleExecution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Ciclo não encontrado
  /api/v1/payment-cycles/{cycleId}/payments/{paymentId}:
    get:
      summary: Consulta pagamento com split de descontos
      parameters:
        - in: path
          name: cycleId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: paymentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pagamento detalhado com itens de desconto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
components:
  parameters:
    YearMonthQuery:
      in: query
      name: yearMonth
      required: true
      description: Competência ISO 8601 (YYYY-MM). ADR-006 § D-B.
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        example: '2026-05'
    CycleIdPath:
      in: path
      name: cycleId
      required: true
      schema:
        type: string
        format: uuid
    PaymentIdPath:
      in: path
      name: paymentId
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Requisição malformada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Token JWT ausente ou inválido (REQ-SEC-001)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnprocessableEntity:
      description: Violação de regra de domínio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    CreatePaymentCycleRequest:
      type: object
      required: [yearMonth, programId]
      properties:
        yearMonth:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: '2026-05'
        programId:
          type: string
          format: uuid

    CycleExecution:
      type: object
      required: [id, yearMonth, status]
      properties:
        id:
          type: string
          format: uuid
        yearMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: '2026-05'
        status:
          type: string
          enum: [RUNNING, COMPLETED, FAILED]

    Payment:
      type: object
      required:
        - id
        - cycleId
        - beneficiaryId
        - beneficiaryCpfMasked
        - yearMonth
        - grossAmount
        - judicialDiscountAmount
        - nonJudicialDiscountAmount
        - totalDiscountAmount
        - netAmount
        - status
      properties:
        id:
          type: string
          format: uuid
        cycleId:
          type: string
          format: uuid
        beneficiaryId:
          type: string
          format: uuid
        beneficiaryCpfMasked:
          description: CPF mascarado XXX.XXX.NNN-NN (copilot-instructions)
          type: string
          example: 'XXX.XXX.789-01'
        yearMonth:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: '2026-05'
        grossAmount:
          type: string
          description: BigDecimal serializado como string para evitar perda de precisão
          example: '1500.00'
        judicialDiscountAmount:
          type: string
          example: '500.00'
        nonJudicialDiscountAmount:
          description: Já com cap REQ-PAY-001 aplicado (ADR-005 — ordem-independente)
          type: string
          example: '300.00'
        totalDiscountAmount:
          description: judicialDiscountAmount + nonJudicialDiscountAmount
          type: string
          example: '800.00'
        thirteenth:
          type: string
          description: REQ-PAY-003 — preenchido apenas em dezembro programa tipo A
          example: '0.00'
        christmasBonus:
          type: string
          description: REQ-PAY-003 — 15% (parametrizado por ADR-004)
          example: '0.00'
        netAmount:
          type: string
          example: '700.00'
        status:
          type: string
          enum: [GENERATED, PAID, RETURNED, REVERSED]

    DiscountRequest:
      type: object
      required: [type, amount]
      properties:
        type:
          type: string
          enum: [J, TAX, PENSION, OTHER]
          description: J = Judicial (sem cap, REQ-PAY-002); demais sofrem cap REQ-PAY-001
        amount:
          type: string
          example: '250.00'
          description: BigDecimal positivo serializado como string

    CorrectionRequest:
      type: object
      required: [factor]
      properties:
        factor:
          type: string
          example: '0.0473'
          description: Multiplicador a aplicar ao grossAmount (REQ-PAY-004)

    ProblemDetails:
      description: |
        Erro em formato Problem Details (RFC 7807). Tipos definidos pelo
        SIFAP listados em /docs/error-types.md.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: 'https://sifap.gov.br/errors/discount-cap-exceeded'
        title:
          type: string
          example: 'Discount cap exceeded'
        status:
          type: integer
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        beneficiaryId: { type: string, format: uuid }
        cycleExecutionId: { type: string, format: uuid }
        competence:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        grossAmount: { type: number, format: 'decimal' }
        totalDiscountAmount: { type: number, format: 'decimal' }
        netAmount: { type: number, format: 'decimal' }
        status:
          type: string
          enum: [GENERATED, PAID, RETURNED, REVERSED]
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentDiscount'
          description: Itens de desconto na ordem de processamento legada (REQ-PAY-002).
    PaymentDiscount:
      type: object
      properties:
        id: { type: string, format: uuid }
        discountType:
          type: string
          enum: [J, P, I, S, A, T, E, O]
          description: J=judicial, P=pensão, I=imposto, S=sindical, A=administrativo, T=taxa, E=empréstimo, O=outros.
        amount: { type: number, format: 'decimal' }
        percentage: { type: number, format: 'decimal', nullable: true }
        processingOrder:
          type: integer
          description: Ordem estável preservando iteração do PE-GROUP legado (CALCDSCT.NSN#L107).
        capApplied:
          type: boolean
          description: true quando o truncamento do teto de 30% disparou neste item.
